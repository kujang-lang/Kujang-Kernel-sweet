name: Build Kernel Sweet with KSU Next & SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bc libncurses5-dev libssl-dev libelf-dev flex bison git ccache zip unzip clang lld llvm curl

      - name: Clone Kernel Source & Toolchain
        run: |
          git clone https://github.com/LineageOS/android_kernel_xiaomi_sm6150.git -b lineage-22.1 --depth=1 kernel
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 toolchain/proton-clang

      - name: Setup KernelSU Next & SUSFS Hooks
        run: |
          cd kernel
          # Mengunduh KernelSU Next terbaru dengan support SUSFS
          curl -LSs "https://raw.githubusercontent.com/rifs250/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          
          # Clone SUSFS patch repository
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 susfs
          
          # Salin header & file susfs ke kernel tree
          cp susfs/kernel_patches/include/linux/susfs.h include/linux/
          cp susfs/kernel_patches/fs/susfs.c fs/
          
          # Terapkan patch susfs ke kernel fs
          patch -p1 < susfs/kernel_patches/5.4/0001-susfs_v5.4.patch || true

      - name: Compile Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/toolchain/proton-clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KBUILD_BUILD_USER="kujang-lang"
          export KBUILD_BUILD_HOST="Kujang-Server"

          make O=out sweet_defconfig
          
          # Konfigurasi aktifkan KSU, OverlayFS, dan SUSFS
          scripts/config --file out/.config -e CONFIG_KSU
          scripts/config --file out/.config -e CONFIG_KSU_SUSFS
          scripts/config --file out/.config -e CONFIG_KSU_SUSFS_HAS_SU_PATH
          scripts/config --file out/.config -e CONFIG_OVERLAY_FS

          make -j$(nproc --all) O=out

      - name: Prepare AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 AK3
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AK3/ 2>/dev/null || cp kernel/out/arch/arm64/boot/Image.gz AK3/
          cd AK3
          zip -r9 Kujang-Kernel-KSUNext-SUSFS-sweet.zip *

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Kujang-Kernel-KSUNext-SUSFS-sweet
          path: AK3/Kujang-Kernel-KSUNext-SUSFS-sweet.zip
