name: Build Kernel Sweet

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bc libncurses5-dev libssl-dev libelf-dev flex bison git ccache zip unzip clang

      - name: Clone Kernel Source & Toolchain
        run: |
          git clone https://github.com/LineageOS/android_kernel_xiaomi_sweet.git -b lineage-20 --depth=1 kernel
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 toolchain/proton-clang

      - name: Compile Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/toolchain/proton-clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out vendor/sweet_defconfig
          make -j$(nproc --all) O=out

      - name: Prepare AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 AK3
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AK3/ 2>/dev/null || cp kernel/out/arch/arm64/boot/Image.gz AK3/
          cd AK3
          zip -r9 Kujang-Kernel-sweet.zip *

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Kujang-Kernel-sweet
          path: AK3/Kujang-Kernel-sweet.zip
